name: Aurora 305 - GKI KernelSU Next v3.4.2 (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 6.1.138 android14-11 4K - built-in KSUN v3.4.2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout MiKernel
        uses: actions/checkout@v4

      - name: Free disk space for Android kernel build
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: rmz
          rmz_version: "3.2.0"
          testing: false

      - name: Build dependencies and pinned packaging
        uses: ./.github/actions/setup-build-environment
        with:
          version: android14-6.1
          sublevel: '138'
          kernel_patches_commit: 41ae18b35d20e0c6ac04116785a4a1089528ae94
          anykernel3_commit: e1e9dce98430c5c6f231f7094a8c7f4ecaf50948

      - name: Download android14-6.1 2025-06 kernel tree and toolchain
        uses: ./.github/actions/download-kernel
        with:
          version: android14-6.1
          android_version: android14
          kernel_version: '6.1'
          os_patch_level: 2025-06

      - name: Pin exact upstream kernel baseline from stock HyperOS 3.0.305.0
        shell: bash
        run: |
          set -euo pipefail
          sha=0c3d559bcd85c64dae9c9c9687abbe5347fff3ad
          git -C kernel/common fetch --depth=1 https://android.googlesource.com/kernel/common "$sha"
          git -C kernel/common checkout --detach FETCH_HEAD
          actual=$(git -C kernel/common rev-parse HEAD)
          test "$actual" = "$sha" || { echo "Wrong kernel source commit: $actual" >&2; exit 1; }
          test "$(sed -n 's/^VERSION = //p' kernel/common/Makefile | head -1)" = 6
          test "$(sed -n 's/^PATCHLEVEL = //p' kernel/common/Makefile | head -1)" = 1
          test "$(sed -n 's/^SUBLEVEL = //p' kernel/common/Makefile | head -1)" = 138
          kmi=$(sed -nE 's/^[[:space:]]*KMI_GENERATION[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' kernel/common/build.config.common kernel/common/build.config.constants 2>/dev/null | head -1)
          test "$kmi" = 11 || { echo "Expected KMI generation 11; got '$kmi'" >&2; exit 1; }
          echo "KERNEL_SOURCE_COMMIT=$actual" >> "$GITHUB_ENV"
          echo "Pinned 6.1.138-android14-11 ACK source: $actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Integrate official KernelSU Next v3.4.2 into GKI
        uses: ./.github/actions/root-setup
        with:
          flavor: next
          commit: 4c706b5938665866ebe16944a481a7b91e3396af

      - name: Verify KernelSU Next v3.4.2 UAPI 5
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C kernel/KernelSU-Next rev-parse HEAD)" = 4c706b5938665866ebe16944a481a7b91e3396af
          grep -q 'KERNEL_SU_UAPI_VERSION = 5;' kernel/KernelSU-Next/uapi/supercall.h
          if grep -q 'config KSU_SUSFS' kernel/KernelSU-Next/kernel/Kconfig; then
            echo "Unexpected SUSFS built-in integration; review this source." >&2
            exit 1
          fi

      - name: Configure minimal 4K built-in GKI (no SUSFS or NoMount yet)
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KPROBES=y
            CONFIG_EXT4_FS=y
            CONFIG_KSU=y
            CONFIG_OVERLAY_FS=y
            CONFIG_TMPFS_XATTR=y
            CONFIG_TMPFS_POSIX_ACL=y
            CONFIG_ARM64_4K_PAGES=y

      - name: Build kernel Image
        uses: ./.github/actions/build-kernel
        with:
          version: android14-6.1
          page_size: 4k

      - name: Fail closed unless output has exact KMI and built-in root
        shell: bash
        run: |
          set -euo pipefail
          image=AnyKernel3/Image
          test -s "$image"
          version=$(strings "$image" | grep -m1 -o 'Linux version 6\.1\.138-android14-11[^[:space:]]*' || true)
          test -n "$version" || { echo "Kernel does not report 6.1.138-android14-11" >&2; exit 1; }
          config=""
          for f in /home/runner/out/.config kernel/bazel-bin/common/kernel_aarch64_config/out_dir/.config; do
            if [ -f "$f" ]; then config="$f"; break; fi
          done
          test -n "$config" || { echo "Cannot verify built-in KSU config" >&2; exit 1; }
          grep -qx CONFIG_KSU=y "$config"
          grep -qx CONFIG_KPROBES=y "$config"
          grep -qx CONFIG_ARM64_4K_PAGES=y "$config"
          sha256sum "$image" | tee AnyKernel3/IMAGE-SHA256.txt
          {
            echo "## Aurora OS3.0.305.0 experimental GKI"
            echo "- Device: Xiaomi 14 Ultra aurora, currently active slot A"
            echo "- Firmware: OS3.0.305.0.WNAMIXM"
            echo "- Kernel: $version"
            echo "- Base source: $KERNEL_SOURCE_COMMIT"
            echo "- KernelSU Next source: 4c706b5938665866ebe16944a481a7b91e3396af (v3.4.2)"
            echo "- SUSFS/NoMount: NOT INCLUDED in this compatibility baseline"
            echo "- Build success does NOT prove boot compatibility; DO NOT FLASH without review"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experimental artifact for review only
        uses: actions/upload-artifact@v4
        with:
          name: AURORA-305-GKI-6.1.138-KSUNext-3.4.2-REVIEW-ONLY
          path: |
            AnyKernel3/Image
            AnyKernel3/IMAGE-SHA256.txt
          if-no-files-found: error
          retention-days: 14
